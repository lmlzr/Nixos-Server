# VPS (example.com, Debian): Firefox-Container (linuxserver/firefox, vmdocker 10.0.0.3:8031) unter
# https://firefox.example.com, per WireGuard statt Cloudflare-Tunnel. Der Container selbst hat keinen
# Login, deshalb fragt nginx vorher Benutzer/Passwort ab (Basic Auth); ohne Login kommt nichts durch.
# Cloudflare: A-Record firefox -> VPS-IP, "DNS only" (graue Wolke); im Tunnel den Hostnamen entfernen.
#
# Einrichten:
#   sudo apt install apache2-utils                         # fuer htpasswd
#   sudo htpasswd -c -B /etc/nginx/htpasswd-firefox leon   # fragt das Passwort ab (bcrypt)
#   sudo chown root:www-data /etc/nginx/htpasswd-firefox && sudo chmod 640 /etc/nginx/htpasswd-firefox
#   sudo cp nginx-firefox.conf /etc/nginx/sites-available/firefox.example.com
#   sudo ln -s /etc/nginx/sites-available/firefox.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d firefox.example.com              # ergaenzt den 443-Block mit Zertifikat
# Erst certbot, wenn diese Datei aktiv ist (sonst schreibt certbot in sites-available/default).
# Falsche Logins landen in /var/log/nginx/error.log ("user ... was not found" / "password mismatch").

server {
    listen 80;
    listen [::]:80;
    server_name firefox.example.com;

    auth_basic "Firefox";
    auth_basic_user_file /etc/nginx/htpasswd-firefox;

    location / {
        proxy_pass http://10.0.0.3:8031;
        include snippets/homelab-proxy.conf;
        # Bildschirm-Stream (WebSocket) nicht puffern
        proxy_buffering off;
        # Den Basic-Auth-Header nicht an den Container weiterreichen
        proxy_set_header Authorization "";
    }
}
