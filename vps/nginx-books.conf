# Komga (neotokyo, nativer NixOS-Dienst) -> books.example.com
# Aktivieren:
#   sudo cp ~/nginx-books.conf /etc/nginx/sites-available/books && sudo ln -s ../sites-available/books /etc/nginx/sites-enabled/books
#   sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d books.example.com
server {
    listen 80;
    listen [::]:80;
    server_name books.example.com;
    client_max_body_size 0; # Uploads in Komga
    location / {
        proxy_pass http://10.0.0.5:25600;
        include snippets/homelab-proxy.conf;
        proxy_buffering off;
    }
    # OPDS-Downloads ohne Content-Disposition: Komga schickt den Dateinamen RFC-2047-kodiert
    # (filename="=?UTF-8?Q?...cbz?="), KOReader speichert das woertlich als "...cbz_=".
    # Ohne den Header nimmt KOReader den Namen aus der URL (.../file/Serie Ch.001.cbz).
    location ~ ^/opds/v[0-9.]+/books/[^/]+/file/ {
        proxy_pass http://10.0.0.5:25600;
        include snippets/homelab-proxy.conf;
        proxy_buffering off;
        proxy_hide_header Content-Disposition;
    }
}
