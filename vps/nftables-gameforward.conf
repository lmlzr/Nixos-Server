#!/usr/sbin/nft -f
# VPS (lmlzr.com, Debian): Spieleports per WireGuard an neotokyo (10.0.0.5) weiterleiten.
# Gleiche Portliste wie services/gameserver-ports.nix. Eigene Tabelle, andere Regeln bleiben unberuehrt.
# Neu laden: sudo systemctl restart nft-gameforward
#
# Die Gameserver sehen als Absender 10.10.0.1 (masquerade), wie vorher mit HAProxy.

table ip gameforward
delete table ip gameforward

table ip gameforward {
  set tcp_ports {
    type inet_service; flags interval
    elements = { 25565-25600, 7777-7790, 8888, 27015-27020, 28082 }
  }
  set udp_ports {
    type inet_service; flags interval
    elements = { 25565-25600, 19132-19133, 5520-5529, 7777-7790, 8766-8770,
                 10999-11010, 27015-27020, 28015, 28017 }
  }

  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    iifname "ens6" tcp dport @tcp_ports dnat to 10.0.0.5
    iifname "ens6" udp dport @udp_ports dnat to 10.0.0.5
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname "wg0" ip daddr 10.0.0.5 masquerade
  }

  chain forward {
    type filter hook forward priority mangle; policy accept;
    # WireGuard-MTU (1420): TCP-Paketgroesse anpassen, sonst haengen grosse Pakete
    oifname "wg0" tcp flags syn tcp option maxseg size set rt mtu
  }
}
