# VPS (lmlzr.com, Debian): Pterodactyl Wings unter https://wings.lmlzr.com, per WireGuard an
# neotokyo (10.0.0.5:8443), wie jellyfin.lmlzr.com. Browser-Konsole (WebSocket), Datei-Manager,
# Up- und Downloads laufen hierueber; das Panel selbst bleibt https://hosting.lmlzr.com.
# Im Panel (Node -> Settings): FQDN wings.lmlzr.com, "Use SSL Connection", "Behind Proxy".
#
# Einrichten:
#   sudo cp nginx-wings.conf /etc/nginx/sites-available/wings.lmlzr.com
#   sudo ln -s /etc/nginx/sites-available/wings.lmlzr.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wings.lmlzr.com     # ergaenzt den 443-Block mit Zertifikat
# Erst certbot, wenn diese Datei aktiv ist (sonst schreibt certbot in sites-available/default).
# Danach pruefen: kein "return 301" im 443-Block, sonst Umleitungsschleife.
# Panel-Node: Daemon Port 443; /etc/pterodactyl/config.yml auf neotokyo: api.port 8443, ssl aus.
server {
    listen 80;
    listen [::]:80;
    server_name wings.lmlzr.com;

    # Uploads ueber den Datei-Manager (Wings-Standardlimit 100 MB)
    client_max_body_size 100m;

    location / {
        proxy_pass http://10.0.0.5:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Konsole: WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Konsolenausgabe und Downloads direkt durchreichen
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
