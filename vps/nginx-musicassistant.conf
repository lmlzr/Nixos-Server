# VPS (example.com, Debian): Music Assistant unter https://musicassistant.example.com, per WireGuard
# an vmdocker (10.0.0.3:8095). Anmeldung uebernimmt Music Assistant selbst (Benutzer aus der
# Ersteinrichtung). Cloudflare: A-Record musicassistant -> VPS-IP, "DNS only" (graue Wolke).
#
# Einrichten:
#   sudo cp nginx-musicassistant.conf /etc/nginx/sites-available/musicassistant.example.com
#   sudo ln -s /etc/nginx/sites-available/musicassistant.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d musicassistant.example.com     # ergaenzt den 443-Block mit Zertifikat
# Erst certbot, wenn diese Datei aktiv ist (sonst schreibt certbot in sites-available/default).
server {
    listen 80;
    listen [::]:80;
    server_name musicassistant.example.com;

    location / {
        proxy_pass http://10.0.0.3:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Web-UI spricht per WebSocket mit dem Server
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Audio-Streams im Browser ohne Puffern durchreichen
        proxy_buffering off;
    }
}
