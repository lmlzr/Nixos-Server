# Checkmk (vmdocker), Site "cmk"
server {
    listen 80;
    listen [::]:80;
    server_name check.example.com;
    location = / {
        return 302 /cmk/check_mk/;
    }
    location / {
        proxy_pass http://10.0.0.3:8081;
        include snippets/homelab-proxy.conf;
    }
}

# Seerr (neotokyo), Film-/Serienwuensche
