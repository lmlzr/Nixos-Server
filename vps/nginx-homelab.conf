    server_name seerr.example.com;
    location / {
        proxy_pass http://10.0.0.5:5055;
        include snippets/homelab-proxy.conf;
    }
}

# FileBrowser Quantum (neotokyo), Dateien teilen
server {
    listen 80;
    listen [::]:80;
    server_name files.example.com;
    client_max_body_size 0;          # grosse Uploads
    location / {
        proxy_pass http://10.0.0.5:8088;
        include snippets/homelab-proxy.conf;
        proxy_buffering off;         # Downloads direkt durchreichen
        proxy_request_buffering off; # Uploads nicht erst auf der VPS-Platte zwischenspeichern
    }
}
