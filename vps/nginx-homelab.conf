# VPS (example.com, Debian): Heimnetz-Dienste per WireGuard statt Cloudflare-Tunnel.
# Gemeinsame Header in nginx-homelab-proxy.conf. Absender bei den Diensten: 10.10.0.1
# (deshalb in HA trusted_proxies und in configuration.nix panel.trustedProxies).
# Cloudflare: A-Records -> VPS-IP, "DNS only" (graue Wolke); im Tunnel die Hostnamen entfernen.
#
# Einrichten:
#   sudo cp nginx-homelab-proxy.conf /etc/nginx/snippets/homelab-proxy.conf
#   sudo cp nginx-homelab.conf /etc/nginx/sites-available/homelab
#   sudo ln -s /etc/nginx/sites-available/homelab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   (DNS in Cloudflare umstellen, dann:)
#   sudo certbot --nginx -d homeassist.example.com -d audiobooks.example.com ...   # einzeln oder alle
# Erst certbot, wenn diese Datei aktiv ist (sonst schreibt certbot in sites-available/default).

# Home Assistant (vmdocker)
server {
    listen 80;
    listen [::]:80;
    server_name homeassist.example.com;
    location / {
        proxy_pass http://10.0.0.3:8123;
        include snippets/homelab-proxy.conf;
    }
}

# Audiobookshelf (neotokyo)
server {
    listen 80;
    listen [::]:80;
    server_name audiobooks.example.com;
    client_max_body_size 0; # Hoerbuch-Uploads
    location / {
        proxy_pass http://10.0.0.5:13378;
        include snippets/homelab-proxy.conf;
        proxy_buffering off;
    }
}

# Mealie (vmdocker)
server {
    listen 80;
    listen [::]:80;
    server_name mealie.example.com;
    client_max_body_size 50m; # Rezeptbilder, Importe
    location / {
        proxy_pass http://10.0.0.3:9925;
        include snippets/homelab-proxy.conf;
    }
}

# ntfy (vmdocker)
server {
    listen 80;
    listen [::]:80;
    server_name push.example.com;
    client_max_body_size 20m; # Anhaenge
    location / {
        proxy_pass http://10.0.0.3:6969;
        include snippets/homelab-proxy.conf;
        # Abos halten die Verbindung offen und bekommen Nachrichten sofort
        # (Timeout 1h aus homelab-proxy.conf, ntfy schickt alle 45 s ein Keepalive)
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Proxmox (router) - eigenes Zertifikat, deshalb ohne Pruefung
server {
    listen 80;
    listen [::]:80;
    server_name router.example.com;
    client_max_body_size 0; # ISO-Uploads
    location / {
        proxy_pass https://10.0.0.2:8006;
        proxy_ssl_verify off;
        include snippets/homelab-proxy.conf;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

