# FreshRSS (neotokyo, nativer NixOS-Dienst, :8097) -> news.example.com
# Aktivieren:
#   sudo cp ~/nginx-news.conf /etc/nginx/sites-available/news && sudo ln -s ../sites-available/news /etc/nginx/sites-enabled/news
#   sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d news.example.com
server {
    listen 80;
    listen [::]:80;
    server_name news.example.com;
    # Trakt-Anmeldung (trakt-rss.nix): Ruecksprung ins Heimnetz weiterreichen, nichts wird nach aussen geoeffnet
    location = /trakt-callback { return 302 http://10.0.0.5:8098/callback$is_args$args; }
    location / {
        proxy_pass http://10.0.0.5:8097;
        include snippets/homelab-proxy.conf;
    }
}
